name: quickbridge
description: "A secure cross-platform file transfer system between Android and Windows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Services
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.3

  # File Handling
  file_picker: ^8.0.3
  open_filex: ^4.4.0
  path_provider: ^2.1.3

  # QR Code Scanning & Generation
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Local Notifications
  flutter_local_notifications: ^17.2.1
  local_notifier: ^0.1.6

  # Device & Network Utilities
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  mime: ^1.0.6
  crypto: ^3.0.3
  permission_handler: ^11.3.1

  # UI and Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
